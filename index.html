<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ยินดีต้อนรับ - Portfolio นางสาวพลอยนภัส ธรรมเวชมงคล</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', sans-serif; }
        body {
            background-color: #fdfbf7;
            color: #4a403a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }
        /* Floating background elements */
        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(232, 195, 173, 0.2);
            z-index: -1;
            animation: float 8s ease-in-out infinite alternate;
        }
        .shape1 { width: 200px; height: 200px; top: 10%; left: 10%; }
        .shape2 { width: 300px; height: 300px; bottom: 5%; right: 10%; animation-duration: 12s; background: rgba(181, 198, 184, 0.2); }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(10deg); }
        }

        .container {
            text-align: center;
            padding: 40px;
            max-width: 700px;
            animation: fadeIn 1.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-img-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(135deg, #e8c3ad, #b5c6b8);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            animation: pulseRing 3s ease-in-out infinite;
        }
        @keyframes pulseRing {
            0% { box-shadow: 0 0 0 0 rgba(232, 195, 173, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(232, 195, 173, 0); }
            100% { box-shadow: 0 0 0 0 rgba(232, 195, 173, 0); }
        }
        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            background-color: #fff;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #3b302a;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #7a6e65;
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* Nav Menu */
        .nav-menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        .nav-btn {
            background-color: #fff;
            color: #5c5048;
            border: 1px solid #e2dad0;
            padding: 10px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .nav-btn:hover, .nav-btn.active {
            background-color: #e8c3ad;
            color: #fff;
            border-color: #e8c3ad;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(232, 195, 173, 0.4);
        }
        
        .welcome-badge {
            display: inline-block;
            background-color: #f4eae1;
            color: #8c6d57;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>

    <div class="container">
        <div class="welcome-badge">✨ Portfolio ✨</div>
        <div class="profile-img-container">
            <img src="pic1.jpg" alt="พลอยนภัส ธรรมเวชมงคล" class="profile-img" onerror="this.src='https://via.placeholder.com/180?text=Nest'">
        </div>
        <h1>ยินดีต้อนรับสู่พอร์ตโฟลิโอ</h1>
	<p class="subtitle">ของ<br></p>
        <p class="subtitle">นางสาวพลอยนภัส ธรรมเวชมงคล (เนสท์)<br></p>

        <div class="nav-menu">
            <a href="index.html" class="nav-btn active">หน้าแรก</a>
            <a href="profile.html" class="nav-btn">ประวัติส่วนตัว</a>
            <a href="education.html" class="nav-btn">ประวัติการศึกษา</a>
            <a href="sop.html" class="nav-btn">Statement of Purpose</a>
            <a href="innovation.html" class="nav-btn">โครงงานนวัตกรรม</a>
            <a href="activities.html" class="nav-btn">กิจกรรมคณะ</a>
            <a href="leadership.html" class="nav-btn">ความเป็นผู้นำ</a>
            <a href="certificate.html" class="nav-btn">ใบประกาศนียบัตร</a>
            <a href="contact.html" class="nav-btn">ช่องทางติดต่อ</a>
        </div>
    </div>
</body>
</html>
